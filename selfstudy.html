<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考前1天·4科目极速通关速刷答题系统</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --accent: #8b5cf6;
      --radius: 12px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .light-theme {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }
    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 12px 24px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1280px;
      margin: 0 auto;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }
    .brand span.tag {
      font-size: 0.75rem;
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      color: white;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      max-width: 1280px;
      margin: 10px auto 0;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .btn {
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      white-space: nowrap;
    }
    .btn:hover {
      background: rgba(59, 130, 246, 0.1);
      border-color: var(--primary);
    }
    .btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }
    .btn-sm { padding: 4px 10px; font-size: 0.8rem; border-radius: 6px; }
    .btn-danger { background: var(--danger); color: white; border-color: var(--danger); }
    .btn-success { background: var(--success); color: white; border-color: var(--success); }

    .subject-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .subject-pill:hover { transform: translateY(-1px); border-color: currentColor; }
    .subject-pill.active {
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      border-width: 2px;
    }

    main {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 20px auto;
      padding: 0 20px 40px;
    }

    /* Stats bar */
    .stats-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 16px;
      align-items: center;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .progress-bar-bg {
      height: 6px;
      background: var(--card-border);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Drill Container */
    .drill-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
    }
    @media (max-width: 860px) {
      .drill-layout { grid-template-columns: 1fr; }
    }

    .question-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    .question-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .badges {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      background: var(--card-border);
      color: var(--text);
    }
    .badge-primary { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
    .badge-hot { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .q-stem {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.7;
      margin-bottom: 24px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .option-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 14px 18px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      outline: none;
    }
    .option-btn:hover:not(:disabled) {
      background: rgba(59, 130, 246, 0.1);
      border-color: var(--primary);
      transform: translateX(4px);
    }
    .opt-key {
      background: var(--card-border);
      border-radius: 6px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .option-btn.selected-correct {
      background: rgba(16, 185, 129, 0.15) !important;
      border-color: var(--success) !important;
      color: #34d399 !important;
    }
    .option-btn.selected-wrong {
      background: rgba(239, 68, 68, 0.15) !important;
      border-color: var(--danger) !important;
      color: #f87171 !important;
    }

    .analysis-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed var(--card-border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-top: 16px;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ans-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 12px;
    }

    /* Right quick jump list */
    .jump-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px;
      height: 600px;
      display: flex;
      flex-direction: column;
    }
    .jump-header {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .jump-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }
    .jump-num {
      height: 34px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }
    .jump-num:hover { border-color: var(--primary); }
    .jump-num.current { border-color: var(--primary); background: var(--primary); color: white; }
    .jump-num.done-correct { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: #34d399; }
    .jump-num.done-wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: #f87171; }

    /* Cheat Sheet & Cards View */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .memo-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      transition: var(--transition);
    }
    .memo-card:hover { border-color: var(--primary); }
    .memo-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .memo-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }
    .memo-content {
      font-size: 0.95rem;
      line-height: 1.8;
      white-space: pre-line;
    }
    .memo-content b, .memo-content strong {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* Search Modal / View */
    .search-input-box {
      width: 100%;
      padding: 12px 18px;
      font-size: 1rem;
      border-radius: 10px;
      border: 1.5px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      margin-bottom: 20px;
    }
    .search-input-box:focus { border-color: var(--primary); }

    .switch-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
    }
    .kbd {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: monospace;
      border: 1px solid var(--card-border);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="brand">
        ⚡ 考前1天4科极速通关系统
        <span class="tag">速刷必过版</span>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <label class="switch-label">
          <input type="checkbox" id="autoAdvanceToggle" checked>
          答对自动切题 (500ms)
        </label>
        <button class="btn btn-sm" onclick="toggleTheme()" title="切换明亮/暗黑主题">🌓 主题</button>
        <button class="btn btn-sm btn-danger" onclick="clearProgress()" title="清空本地刷题数据">🗑️ 重置</button>
      </div>
    </div>

    <!-- Subject Switcher -->
    <div class="nav-tabs" id="subjectBar"></div>

    <!-- Mode Switcher -->
    <div class="nav-tabs" id="modeBar">
      <button class="btn active" onclick="setMode('drill')">🚀 极速刷题</button>
      <button class="btn" onclick="setMode('memo')">📖 背诵速记卡</button>
      <button class="btn" onclick="setMode('wrong')">❌ 错题消灭营 (<span id="wrongCountBadge">0</span>)</button>
      <button class="btn" onclick="setMode('mock')">📝 全真模拟考</button>
      <button class="btn" onclick="setMode('cheatsheet')">📑 考前一页纸讲义</button>
      <button class="btn" onclick="setMode('search')">🔍 秒级智能搜题</button>
    </div>
  </header>

  <main>
    <!-- Stats Bar -->
    <div class="stats-card">
      <div class="stat-item">
        <span class="stat-label">当前科目题库</span>
        <span class="stat-value" id="statTotalQ">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">已刷题数</span>
        <span class="stat-value" style="color: var(--primary);" id="statAnsweredQ">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">正确率</span>
        <span class="stat-value" style="color: var(--success);" id="statAccuracy">0%</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">错题待消灭</span>
        <span class="stat-value" style="color: var(--danger);" id="statWrongQ">0</span>
      </div>
      <div class="stat-item" style="grid-column: span 2;">
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted);">
          <span>总体刷题进度</span>
          <span id="statPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="statProgressFill"></div>
        </div>
      </div>
    </div>

    <!-- VIEW 1: SPEED DRILL & WRONG CLEARANCE -->
    <div id="drillView">
      <div class="drill-layout">
        <!-- Question Box -->
        <div class="question-panel" id="questionBox">
          <!-- Injected via JS -->
        </div>

        <!-- Jump Navigation -->
        <div class="jump-panel">
          <div class="jump-header">
            <span>题号直达</span>
            <span style="font-size: 0.8rem; color: var(--text-muted);" id="jumpStats">0 / 0</span>
          </div>
          <div class="jump-grid" id="jumpGrid">
            <!-- Numbers injected via JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- VIEW 2: MEMO CARDS (背诵速记) -->
    <div id="memoView" style="display: none;">
      <div style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.95rem; color: var(--text-muted);">
          💡 点击“展开/折叠答案”可进行考前自我提问默写；加粗高亮为必背核心采分词。
        </span>
        <button class="btn btn-sm" onclick="toggleAllAnswers()">👁️ 一键展开/隐藏全部答案</button>
      </div>
      <div class="cards-list" id="memoList"></div>
    </div>

    <!-- VIEW 3: CHEAT SHEET (考前一页纸) -->
    <div id="cheatSheetView" style="display: none;">
      <div class="cards-list" id="cheatSheetList"></div>
    </div>

    <!-- VIEW 4: SEARCH VIEW -->
    <div id="searchView" style="display: none;">
      <input type="text" class="search-input-box" id="searchInput" placeholder="🔍 输入关键词实时搜题，例如：化归、TRIZ、剩余价值、四部分类法、六顶思考帽..." oninput="doSearch()">
      <div class="cards-list" id="searchResults"></div>
    </div>

    <!-- VIEW 5: MOCK EXAM -->
    <div id="mockView" style="display: none;">
      <div class="question-panel" style="text-align: center; padding: 40px;" id="mockIntroBox">
        <h2 style="margin-bottom: 12px;">📝 4科目考前全真模拟试卷</h2>
        <p style="color: var(--text-muted); margin-bottom: 24px;">
          系统将从当前科目精选单选、判断、多选及核心简答大题组卷，全真还原考试场景与计分机制。
        </p>
        <button class="btn btn-success" style="font-size: 1.1rem; padding: 12px 30px;" onclick="startMockExam()">开始计时模拟考 (45分钟)</button>
      </div>
      <div id="mockContentBox" style="display: none;">
        <!-- Mock running content -->
      </div>
    </div>
  </main>

产关系的矛盾运动构成了人类社会基本规律。\n② 现实意义：\n   - 是我国全面深化改革的哲学理论依据；\n   - 必须坚持以经济建设为中心，大力发展社会生产力；\n   - 必须通过改革不断调整和完善不适应生产力发展的体制机制，发展新质生产力。", "explanation": "【自考必背大题】：历年真题压轴大题，分点清晰，结合原理+现实阐述即可拿满分。", "highYield": true}, {"id": "marx_essay_178", "subjectId": "marx", "chapter": "第五章 资本主义的发展及其趋势", "type": "essay", "stem": "试述资本主义被社会主义所代替的历史必然性。", "options": null, "answer": "① 根本原因：资本主义基本矛盾（生产社会化与生产资料资本主义私人占有之间的矛盾）是资本主义自身无法克服的痼疾；\n② 经济条件：资本主义的发展使生产社会化、管理社会化程度极大提高，为向社会主义过渡准备了充分的客观物质条件；\n③ 阶级力量：无产阶级是先进生产力的代表者，无产阶级政党的领导与革命斗争是实现社会变革的主体力量；\n④ 历史趋势：虽然资本主义在其自身框架内进行了部分调节和改良，但无法从根本上消除基本矛盾与经济危机，资本主义必然灭亡、社会主义必然胜利是人类社会历史发展的总趋势。", "explanation": "【自考必背大题】：历年真题压轴大题，分点清晰，结合原理+现实阐述即可拿满分。", "highYield": true}]}, {"id": "info", "name": "信息管理概论", "code": "04222", "badge": "题库大全 + 形考小抄 + 考点必看", "icon": "💾", "color": "#3b82f6", "description": "涵盖信息与数据本质特征、信息技术与系统架构（MIS/DSS/OA）、信息资源管理、知识管理与网络信息安全全套题库。", "questions": [{"id": "info_judge_001", "subjectId": "info", "chapter": "第一部分 判断题必刷", "type": "judge", "stem": "信息是客观事物的特征通过一定物质载体形式的反映。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "标准答案：A 正确。源自04222自考核心题库及形考判断题。", "highYield": true}, {"id": "info_judge_002", "subjectId": "info", "chapter": "第一部分 判断题必刷", "type": "judge", "stem": "凡是我们接收到的数据都是信息。", "options": ["正确 (√)", "错误 (×)"], "answer": "错误", "explanation": "标准答案：B 错误。源自04222自考核心题库及形考判断题。", "highYield": true}, {"id": "info_judge_003", "subjectId": "info", "chapter": "第一部分 判断题必刷", "type": "judge", "stem": "信息也可以是商品，具有使用价值和价值。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "标准答案：A 正确。源自04222自考核心题库及形考判断题。", "highYield": true}, {"id": "info_judge_004", "subjectId": "info", "chapter": "第一部分 判断题必刷", "type": "judge", "stem": "信息是有寿命的。A 正确 12、按照信息的内容可以将信息分为生物信息和社会信息。", "options": ["正确 (√)", "错误 (×)"], "answer": "错误", "explanation": "标准答案：B 错误。源自04222自考核心题库及形考判断题。", "highYield": true}, {"id": "info_judge_005", "subjectId": "info", "chapter": "第一部分 判断题必刷", "type": "judge", "stem": "语义信息是信息认识过程中的最高层次。", "options": ["正确 (√)", 的运动的一般规律：信息在运动过程 中主要经历了信息的产生、信息的获取、 信息的再生和信息施效四个主要过程， 在运动过程中，信息遵循着一定的传递 规律、优化或自组织规律、智能化规律 等。信息运动的过程可以应用于各类事 物，只有把握好信息的规律，才能更好 实现对事物的改造。 4）揭示利用信息进 行有效控制的手段和描述及优化系统的 方法和原理：在信息运动中，信息的施 效过程是最关键的一环，它决定着人们 实现改造对象的想法的成效。信息施效 表现为“控制” ，“控制”的作用是理解 和执行认识论意义的信息，引导系统达 到规定的目的状态，完成对对象施行的 变革。5）寻求通过加工信息来生成智能 和发展智能的机制与途经。在信息在运 动中，主体应具有智能，主体智能水平 越高，相应的信息过程就越有效，智能 是一种利用信息的能力 。信息科学具有自 己的一套完善的科学方法体系，即信息 科学方法化体系。此体系包括一个方法 两个准则，这个方法就是信息方法，两 个准则是结构—功能—行为辩证统一准 则、物质—能量—信息三位一体准则。 信息方法就是运用信息的观点，把系统 的运动过程看作信息传递和信息转换的 过程，通过对信息流程的分析和处理， 获得对某一复杂系统运动过程的规律性 认识的一种研究方法。 结构功能行为辩证统一准则：认为有什 么样的结构就会产生什么样的功能、什 么样的行为，具有同样功能的系统不一 定具有相同的结构。 物质能量信息三位一体准则 ：揭示了三者 的重要作用，在分析信息运动过程中， 不能只考虑物质与能量，信息同样重要。", "explanation": "【考前1天速记】：自考高频必背点，包含历年填空、名词解释及简答题核心得分词。", "highYield": true}, {"id": "info_fill_370", "subjectId": "info", "chapter": "第四部分 核心考点速刷", "type": "fill", "stem": "【考前必记考点 10】管理学发展的五阶段，掌握每个阶段 的名称与相关理论思想。 答：第一阶段：科学管理阶段。主要以 科学管理之父泰勒、管理理论之父法约 尔和组织管理之父韦伯为代表。 第二阶 段：行为科学理论及管理理论丛林的发 展阶段。梅奥---- 人际关系理论、...", "options": null, "answer": "管理学发展的五阶段，掌握每个阶段 的名称与相关理论思想。 答：第一阶段：科学管理阶段。主要以 科学管理之父泰勒、管理理论之父法约 尔和组织管理之父韦伯为代表。 第二阶 段：行为科学理论及管理理论丛林的发 展阶段。梅奥---- 人际关系理论、社会 人理论。马洛斯---- 需求层次理论（人 的需求由低级到高级分七个层次：生理 需求，安全需求 ，社会交往需求，尊重需 求，求知需求，求美需求，自我实现需求）。 赫茨柏格-- 双因素理论。第三阶段：以战 略为主的企业组织理论发展阶段。《竞 争战略》、《竞争优势》、《国家竞争优 势》—波特三部曲。第四阶段：企业再造 理论与企业文化管理理论。企业文化构 成：企业精神文化、企业制度文化、企 业物质文化。第五阶段：全球化及知识 经济时代的组织管理理论。彼得·圣吉 的五项修炼：系统思考、自我超越、改 善心智模式、建立共同愿景 、团体学习。", "explanation": "【考前1天速记】：自考高频必背点，包含历年填空、名词解释及简答题核心得分词。", "highYield": true}, {"id": "info_fill_371", "subjectId": "info", "chapter": "第四部分 核心考点速刷", "type": "fill", "stem": "【考前必记考点 12】大众信息交流的特点。 答：1 大众信 息交流中的传播者是从事信息生产和传 播的专业化媒介组织； 2 大众信息交流是 运用先进的传播技术和产业化手段大量 生产、复制和传播信息的活动，传播的 媒介日益复杂化和现代化； 3 大众信息交 流的对象是...", "options": null, "answer": "大众信息交流的特点。 答：1 大众信 息交流中的传播者是从事信息生产和传 播的专业化媒介组织； 2 大众信息交流是 运用先进的传播技术和产业化手段大量 生产、复制和传播信息的活动，传播的 媒介日益复杂化和现代化； 3 大众信息交 流的对象是社会上的一般大众，它不受 性别、职业、年龄、社会地位、文化层 次等的影响；4 大众信息交流的信息既具 有商品属性，又具有文化属性；5 从交流 的过程来看，大众信息交流属于单向性 的信息交流活动；6 大众信息交流是一种 制度化的社会信息交流方式； 7 是对信息 接受者的立场、观点、态度、行为、文化 法律的制定和 实施必须考虑现实社会的道德基础，所 以说，是信息政策和信息法律建立和发 挥作用的基础；而在自觉、自发的道德 约束无法涉及的领域，以法制手段调节 信息活动中的各种关系的信息政策和信 息法律则能够发挥充分的作用；信息政 策弥补了信息法律滞后的不足，其形式 较为灵活，有较强的适应性，而信息法 律则将相应的信息政策、信息道德固化 为成文的法律、规定、条例等形式，从 而使信息政策和信息道德的实施具有一 定的强制性，更加有法可依。信息道德、 信息政策和信息法律三者相互补充、相 辅相成，共同促进各种信息活动的正常 进行。 1．简述数据、信息、知识、智能之间的 关系及含义 答：数据是关于事件和世界的一组独立 的事实。信息是捕捉了来龙去脉的内容 并加以经验和想法后的产出物。 知识是 由个人的隐式经验、想法、洞察力、价 值以及判断等组成，它是动态的，且只 能通过与有知识的专家直接合作与交流 才能得到。智能是激活了的知识，主要 表现为收集、加工、应用、传播信息和 知识的能力，及对事物发展的前瞻性看 法。 它们之间的关系主要表现在：数据 是零散的，没有联系的事务。数据与信 息的关系是形式与内容的关系、原材料 与产品的关系，数据经过加工后就变成 了信息。信息与知识的关系即信息经过 推理与提炼、编码系统化就成为知识。 知识与智能的关系则为：智能是基于知 识的一种谋略或行动。总之，数据、信 息、知识和智能这四者是由低到高、由 浅入深的关系。", "explanation": "【考前1天速记】：自考高频必背点，包含历年填空、名词解释及简答题核心得分词。", "highYield": true}, {"id": "info_fill_416", "subjectId": "info", "chapter": "第四部分 核心考点速刷", "type": "fill", "stem": "【考前必记考点 2】简述ERP 、SCM 、CRM 之间有什么 关系？它们关注的重点有何区别？重点 答：ERP：即企业资源计划，它的管理范 围包含了整个企业的财务、制造和人力 三大职能领域，是建立在信息技术基础 上，重在对企业内部的业务流程进行系 统化的管理，...", "options": null, "answer": "简述ERP 、SCM 、CRM 之间有什么 关系？它们关注的重点有何区别？重点 答：ERP：即企业资源计划，它的管理范 围包含了整个企业的财务、制造和人力 三大职能领域，是建立在信息技术基础 上，重在对企业内部的业务流程进行系 统化的管理，实现内部的信息共享。 SCM：即供应链管理，它涉及生产企业、 分销商、零售企业、批发企业及客户等 整个产品制造、销售的全部流程。SCM覆 盖了供应链上所有环节，加强了对供应 链上企业的协调和企业外部物流、资金 流、信息流的集成，弥补了ERP 的不足。 CRM：即客户关系管理，它通过信息技术， 使企业市场营销、销售管理、客户服务 和支持等经营流程信息化，实现客户资 源有效的利用。CRM 注重培养以客户为 中心的经营行为，它弥补了 ERP 在前台 的不足，通过分析销售活动中产生的数 据，挖掘出对企业有价值的信息，调动 企业一切资源，为客户服务，以提升客 户满意度，增加企业效益。 ERP、SCM、CRM三者的关系：无论是ERP、 SCM 还是CRM，其根本目标都在于降低库 存、加快资金周转、提高企业的管理水 平，以提高企业对市场的响应速度。企 业的整体发展规划必然要求三者的最终 集成，同时技术的发展为三者的融合也 提供了支持。三者是相互联系，互为补 充的。 三者无论是在现在的生产应用还是对 企业将来的发展都起到很重要的作用， 如果一个企业能把这三者有机的结合并 且很好的利用，会使得这个企业很好的 并且快速的发展壮大起来的！ 3 ．如何揭示信息的内在特征，揭示的方 法主要有哪能些？ 答：揭示信息的内在特征就是信息所包 含和承载的具体内容，信息揭示就是对 信息的内容特征进行深层揭示并转换成 主题标识，形成一个科学的逻辑的概念 标识系统。 信息揭示的过程一般为：主题分析、主 题标引、检验审核。 在主题分析过程中，主要包括对主题数 量的分析、主题结构的分析、主题内容 的分析。 在主题标引过程中，主要采用抽词标引、 赋词标引、分类标引三种方法。 4 论述常用的网络信息检索技术及其检 索方法： 答：常用的网络信息检索技术主要有： 布尔逻辑检索、位置检索、截词检索、", "explanation": "【考前1天速记】：自考高频必背点，包含历年填空、名词解释及简答题核心得分词。", "highYield": true}, {"id": "info_fill_417", "subjectId": "info", "chapter": "第四部分 核心考点速刷", "type": "fill", "stem": "【考前必记考点 5】信息管理的人文手段主要有哪些， 并对 它们的含义进行阐释。 答：信息管理的人文手段主要有信息政 策、信息法律、信息道德。 信息政策是指用以调节信息搜集、加 工、存储、处理及传播等信息活动的指 导原则、法令;指南、规则、条例、手续 等所构成的...", "options": null, "answer": "信息管理的人文手段主要有哪些， 并对 它们的含义进行阐释。 答：信息管理的人文手段主要有信息政 策、信息法律、信息道德。 信息政策是指用以调节信息搜集、加 工、存储、处理及传播等信息活动的指 导原则、法令;指南、规则、条例、手续 等所构成的相关的政策群体，它涉及信 息产品的生产、分配、交换和消费等各 个环节以及整个信息产业的相关问题。 信息法律是由国家立法机关制定或 认可并由国家强制力保证实施的各种行 为规范的总和。 信息道德是指在信息的采集、加工、 存贮、传播和利用等信息活动各个环节 中，用来规范期间产生的各种社会关系 的道德意识、道德规范和道德行为的总 和。信息道德作用信息管理的一种手段， 与信息政策、信息法律有密切的关系， 它们各自从不同的角度实现对信息及信 息行为的规范和管理。信息道德以其巨 大的约束力在潜移默化中规范人们的信 息行为，信息政策和信息法律的制定和 实施必须考虑现实社会的道德基础，所 以说，是信息政策和信息法律建立和发 挥作用的基础；而在自觉、自发的道德约 束无法涉及的领域，以法制手段调节信 息活动中的各种关系的信息政策和信息 法律则能够发挥充分的作用；信息政策 弥补了信息法律滞后的不足，其形式较 为灵活，有较强的适应性，而信息法律则 将相应的信息政策、信息道德固化为成 文的法律、规定、条例等形式，从而使 信息政策和信息道德的实施具有一定的 强制性，更加有法可依。信息道德、信 息政策和信息法律三者相互补充 、相辅 相成，共同促进各种信息活动的正常进 行。", "explanation": "【考前1天速记】：自考高频必背点，包含历年填空、名词解释及简答题核心得分词。", "highYield": true}, {"id": "info_fill_418", "subjectId": "info", "chapter": "第四部分 核心考点速刷", "type": "fill", "stem": "【考前必记考点 6】信息管理在古代、近代、现代信息管 理活动时期的发展过程及其在各时期的 特点。 答：在古代时期，我国的信息管 理活动在全世界是最具有代表性的。古 代信息管理时期的信息管理以纸制手抄 本以及印刷本为主，数量有限。由此可 见，古代时期的信息管理活...", "options": null, "answer": "信息管理在古代、近代、现代信息管 理活动时期的发展过程及其在各时期的 特点。 答：在古代时期，我国的信息管 理活动在全世界是最具有代表性的。古 代信息管理时期的信息管理以纸制手抄 本以及印刷本为主，数量有限。由此可 见，古代时期的信息管理活动，没有形 成社会规模; 社会信息资源数量有限，并 且以纸制手抄本及印刷本为主 ; 信息存 储的方式是封闭的、私有的；信息管理 的手与方法以手工为主，创造出了适用 与当时的信息资源状况的独特方法，并 且将此方法与学术研究及其方法结合在 一起，文献资源的所有者或是官方指写的 官员，是信息管理的主体 ，完成信息管理 活动，执行管理活动，执行信息管理行为。 近代信息管理活动时期应该是从机器大 生产代替手工生产、资本主义代替封建 主义成为世界主流社会形态后开始的。 这一阶段，以文献信息为中心，图书馆 为主要场所，由专门的信息管理专业人 员所创造的一系列技术手段为信息管理 的主要方法，同时出现了针对信息惧、 处理、保存、利用等过程的解释。 现代信息管理理念和信息管理技术水平 与手段与古代、近代时期有本质的区别。 信息技术在信息管理活动的发展中占有 重要地位，它主导着信息管理各时期的 发展。伴随着信息技术的变化，信息资 源类型不断多样化。除了文献型信息淘 汰外，还出现了缩微型、电子型、网络 型等新型媒体，如上的流媒体，已经引 起了人们极大的兴趣与关注。现代的信 息管理已经大超越了古代和近代时期对 信息管理的理解框架，发生了技的认识 变化；信息管理的内涵与外延都得到了 扩大，它所面对的信息资源已经远远走 超出了传统的文献型信息资源的范畴， 扩大到了多种新型的信息类型，整个社 会的信息资源呈几何级数增长，不同的 关门和领域均不得不面对信息管理的挑 战；信息管理技术充分利用了现代信息 技术的优势，突破了传统处理文献的信 息管理技术范围，大量采用了网络、数 据库、数据仓库、联机分析技术等先进 技术手段与方法，而信息管理人员早忆 不公是以传统的文献信息处理为任务， 而且更加技术化、专业化、专门化，他 们在组织内部被称为ＣＩＯ或ＣＫＯ， 已成为社会组织中的一个阶层。", "explanation": "【考前1天速记】：自考高频必背点，包含历年填空、名词解释及简答题核心得分词。", "highYield": true}]}, {"id": "math", "name": "数学思想与方法", "code": "09097", "badge": "12章体系 + 高频判断 + 论述必背", "icon": "📐", "color": "#10b981", "description": "涵盖数学思想与方法定义、四大历史突破、抽象化归模型公理化、归纳类比猜想、算法分类、教学原则与论述大题深度解析。", "questions": [{"id": "math_judge_001", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "数学基础知识是明线，数学思想方法是暗线。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "数学基础知识是明线，数学思想方法是暗线，两条不都是明线。这是历年反复考查的判断题。", "highYield": true}, {"id": "math_judge_002", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "数学抽象具有无物质性。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "数学抽象舍弃事物的物理属性与物质材质，只保留数量关系与空间形式，具有无物质性。", "highYield": true}, {"id": "math_judge_003", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "公理化方法是万能的。", "options": ["正确 (√)", "错误 (×)"], "answer": "错误", "explanation": "公理化方法具有局限性（如哥德尔不完备定理），不能解决数学中的所有问题，不是万能的。", "highYield": true}, {"id": "math_judge_004", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "猜想具有科学性和推测性两大特点。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "猜想是在已有经验和知识基础上提出的合情推测，兼具一定的科学依据和不确定推测性。", "highYield": true}, {"id": "math_judge_005", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "欧拉用一笔画原理解决了哥尼斯堡七桥问题。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "欧拉把陆地抽象为点、把桥抽象为线，转化为一笔画问题，开创了图论与拓扑学。", "highYield": true}, {"id": "math_judge_006", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "分类的两大要素是母项和子项。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "分类是将一个母项按照特定标准划分为若干不相容的子项。", "highYield": true}, {"id": "math_judge_007", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "算法具有有限性、确定性、有效性、输入和输出五大特征。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "算法是一组有限规则，其每一步都必须是确定的、有限的、有效的。", "highYield": true}, {"id": "math_judge_008", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "不完全归纳推理得到的结论一定正确。", "options": ["正确 (√)", "错误 (×)"], "answer": "错误", "explanation": "不完全归纳法仅考察了部分对象，结论具有或然性，属于合情推理，必须经过后续演绎证明。", "highYield": true}, {"id": "math_judge_009", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "类比推理的结论具有必然性。", "options": ["正确 (√)", "错误 (×)"], "answer": "错误", "explanation": "类比推理根据两个对象部分属性相同推测其余属性也相同，结论具有或然性（可能正确也可能不正确）。", "highYield": true}, {"id": "math_judge_010", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "分析法是执果索因，综合法是由因导果。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "分析法从结论出发倒推充分条件；综合法从已知条件出发正向推导演绎结论。", "highYield": true}, {"id": "math_judge_011", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "《九章算术》侧重逻辑演绎，《几何原本》侧重算法应用。", "options": ["正确 (√)", "错误 (×)"], "answer": "错误", "explanation": "正好相反！古希腊《几何原本》侧重逻辑演绎公理化，中国古代《九章算术》侧重算法与实际应用。", "highYield": true}, {"id": "math_judge_012", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "弱抽象是由特殊到一般，强抽象是由一般到特殊。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "弱抽象减弱条件，由特殊到一般（如正方形→矩形）；强抽象增加特征，由一般到特殊（如三角形→等腰三角形）。", "highYield": true}, {"id": "math_judge_013", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "随机现象是指在一定条件下结果不确定，但大量重复试验具有统计规律的现象。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "确定性现象结果唯一确定，随机现象个体不确定但群体呈现统计规律。", "highYield": true}, {"id": "math_judge_014", "subjectId": "math", "chapter": "全册高频判断题汇总", "type": "judge", "stem": "学生掌握数学思想方法的三个阶段是潜意识阶段、明朗化阶段和深刻理解阶段。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "潜意识阶段只做题未意识到方法；明朗化阶段清晰认知方法；深刻理解阶段能主动迁移应用。", "highYield": true}, {"id": "math_essay_001", "subjectId": "math", "chapter": "第一章 数学思想方法概述", "type": "essay", "stem": "简述数学的三个基本特点及其内涵。", "options": null, "answer": "① 抽象性：舍弃事物的物理材质与现实内容，只保留事物的数量关系和空间形式，具有多层次抽象性；\n② 严谨性：逻辑严密，推导环环相扣，结论确定，必须依靠演绎证明；\n③ 应用广泛性：几乎所有科学、工程、经济以及社会生活领域都可以建立数学模型进行定量化研究。", "explanation": "【评分标准与速背点】分点作答，条理清晰，答出核心关键词（加粗部分）即可得分。", "highYield": true}, {"id": "math_essay_002", "subjectId": "math", "chapter": "第一章 数学思想方法概述", "type": "essay", "stem": "简述学生理解和掌握数学思想方法的三个阶段。", "options": null, "answer": "① 潜意识阶段：学生只专注于做题解题，没有自觉意识到背后所蕴含的数学思想方法；\n② 明朗化阶段：在教师引导或系统学习后，能够清晰、自觉地识别并说出所运用的思想方法；\n③ 深刻理解阶段：能够融会贯通，在遇到未知的新情境、新问题时，主动自觉地迁移和运用相应的思想方法进行解决。", "explanation": "【评分标准与速背点】分点作答，条理清晰，答出核心关键词（加粗部分）即可得分。", "highYield": true}, {"id": "math_essay_003", "subjectId": "math", "chapter": "第四章 化归方法", "type": "essay", "stem": "简述化归方法的含义、三要素及基本原则。", "options": null, "answer": "【含义】化归即转化与归结，将待解决的未知、复杂、困难问题，转化为已经解决或容易解决的问题。核心原则是未知→已知，复杂→简单。\n【三要素】\n① 化归对象：需要转化的原问题；\n② 化归目标：转化后要达到的熟悉、简明问题；\n③ 化归途径：实现转化的数学手段与工具（如换元、数形结合、降次、消元、构造等）。\n【基本原则】熟悉化原则、简单化原则、和谐化原则、直观化原则、标准化原则。", "explanation": "【评分标准与速背点】分点作答，条理清晰，答出核心关键词（加粗部分）即可得分。", "highYield": true}, {"id": "math_essay_004", "subjectId": "math", "chapter": "第五章 数学模型方法", "type": "essay", "stem": "简述数学模型方法的建模步骤。", "options": null, "answer": "① 分析原型：深入调研实际问题背景，明确研究目的与要素；\n② 简化假设：舍弃次要因素，抓住主要矛盾，作出合理假设；\n③ 构造模型：用数学符号、公式、方程式或图形表达变量关系；\n④ 求解模型：运用数学方法与算法计算出数学解答；\n⑤ 检验模型：将数学计算结果与实际情况进行对照，验证合理性；\n⑥ 解释应用：将检验合格的模型成果翻译回现实生活进行决策或控制。", "explanation": "【评分标准与速背点】分点作答，条理清晰，答出核心关键词（加粗部分）即可得分。", "highYield": true}, {"id": "math_essay_005", "subjectId": "math", "chapter": "第六章 公理化方法", "type": "essay", "stem": "简述公理化方法中公理体系的三个基本要求。", "options": null, "answer": "① 相容性（无矛盾性）：公理体系中最重要的一条，体系内公理之间不能相互推出逻辑矛盾（即不能同时证明A和非A）；\n② 独立性：体系中任何一条公理都不能由其他公理推导得出，保证公理集合精简无冗余；\n③ 完备性：体系中该领域内的一切真命题，原则上都能从这组公理出发演绎证明出来。", "explanation": "【评分标准与速背点】分点作答，条理清晰，答出核心关键词（加粗部分）即可得分。", "highYield": true}, {"id": "math_essay_006", "subjectId": "math", "chapter": "第九章 分类方法", "type": "essay", "stem": "简述分类方法的基本原则及要素。", "options": null, "answer": "【分类要素】母项（被划分的概念）和子项（划分得到的各个概念）。\n【分类三原则】\n① 同一标准原则：每次分类过程中，必须自始至终采用同一个划分标准；\n② 完备性（穷尽性）原则：所有子项的外延总和必须等于母项的外延，不能有遗漏；\n③ 互斥性原则：各个子项之间必须互相排斥，外延不能有重叠交叉。", "explanation": "【评分标准与速背点】分点作答，条理清晰，答出核心关键词（加粗部分）即可得分。", "highYield": true}, {"id": "math_essay_007", "subjectId": "math", "chapter": "第十二章 数学思想方法教学", "type": "essay", "stem": "简述数学思想方法教学的基本原则。", "options": null, "answer": "① 渗透性原则：数学思想方法不应脱离基础知识孤立空洞讲授，而必须渗透在具体概念、公式和解题中；\n② 循序渐进原则：结合学生的认知规律，由低到高、由感性到理性逐步深入；\n③ 反复性原则：思想方法的掌握无法一蹴而就，必须在不同章节、不同知识情境中多次重现；\n④ 系统性原则：统筹规划，使各类思想方法前后呼应，形成网状结构。", "explanation": "【评分标准与速背点】分点作答，条理清晰，答出核心关键词（加粗部分）即可得分。", "highYield": true}, {"id": "math_essay_008", "subjectId": "math", "chapter": "第十二章 数学思想方法教学", "type": "essay", "stem": "论述：在中小学数学教学中如何有效渗透数学思想方法？", "options": null, "answer": "① 在数学概念的形成过程中渗透：概念的产生往往伴随抽象、概括与分类，教学中应引导学生经历从具体实例抽象出本质属性的过程；\n② 在定理、法则与公式的推导过程中渗透：推导过程蕴含化归、归纳、数形结合与公理化思想，让学生理解知识的来龙去脉而非死记结论；\n③ 在问题解决与解题思路的探索过程中渗透：通过分析法、综合法、类比法启发学生寻找解题突破口，体验化未知为已知的过程；\n④ 在单元复习与小结提升中提炼思想方法：引导学生跳出题目看通法，将零散知识点串联为思想方法体系，促成知识向素养的迁移。", "explanation": "【评分标准与速背点】分点作答，条理清晰，答出核心关键词（加粗部分）即可得分。", "highYield": true}, {"id": "math_choice_001", "subjectId": "math", "chapter": "第一章 数学思想方法概述", "type": "choice", "stem": "数学教学的两条主线是（ ）", "options": ["A. 数学基础知识（明线）与数学思想方法（暗线）", "B. 几何知识（明线）与代数知识（暗线）", "C. 课堂讲授（明线）与课后作业（暗线）", "D. 理论推导（明线）与实际应用（暗线）"], "answer": "A", "explanation": "教材明确指出：数学教学的两条主线是数学基础知识（明线）与数学思想方法（暗线）。", "highYield": true}, {"id": "math_choice_002", "subjectId": "math", "chapter": "第一章 数学思想方法概述", "type": "choice", "stem": "推动数学发展的两大根本动力是（ ）", "options": ["A. 生产力与生产关系", "B. 实践的需要与理论的需要", "C. 科学家的兴趣与国家的资助", "D. 几何的探索与代数的计算"], "answer": "B", "explanation": "数学发展的根本动力来自两方面：一是外部实践的需要（生产劳动、工程技术），二是内部理论发展的需要（逻辑自洽、公理完备）。", "highYield": true}, {"id": "math_choice_003", "subjectId": "math", "chapter": "第二章 数学思想方法的重大突破", "type": "choice", "stem": "数学史上的第二次重大突破是指从常量数学向变量数学的转变，其标志是（ ）", "options": ["A. 引入字母符号", "B. 微积分的诞生", "C. 非欧几何的创立", "D. 计算机的发明"], "answer": "B", "explanation": "第二次重大突破：常量数学→变量数学，基础是笛卡尔解析几何，标志是牛顿、莱布尼茨微积分的诞生；第一次突破标志是引入字母符号（算术→代数）。", "highYield": true}, {"id": "math_choice_004", "subjectId": "math", "chapter": "第二章 数学思想方法的重大突破", "type": "choice", "stem": "古代数学的两大代表体系中，古希腊《几何原本》与中国古代《九章算术》分别侧重（ ）", "options": ["A. 逻辑演绎公理化；算法与实际应用", "B. 算法与实际应用；逻辑演绎公理化", "C. 算术计算；方程求解", "D. 空间想象；数论探究"], "answer": "A", "explanation": "古希腊欧几里得《几何原本》建立了最早的公理化演绎体系；中国古代《九章算术》以解决实际问题见长，注重构造性算法体系。", "highYield": true}, {"id": "math_choice_005", "subjectId": "math", "chapter": "第三章 抽象方法", "type": "choice", "stem": "从正方形概念减弱约束条件得到矩形概念，这种抽象方式属于（ ）", "options": ["A. 强抽象", "B. 弱抽象", "C. 广义抽象", "D. 纯形式抽象"], "answer": "B", "explanation": "弱抽象：从原型中选取某一特征，减弱条件得到新概念，由特殊走向一般；强抽象则是增加特征，由一般走向特殊（如三角形→等腰三角形）。", "highYield": true}, {"id": "math_choice_006", "subjectId": "math", "chapter": "第四章 化归方法", "type": "choice", "stem": "化归思想的核心原则是（ ）", "options": ["A. 已知转化为未知", "B. 未知转化为已知，复杂转化为简单", "C. 简单转化为复杂", "D. 几何转化为代数"], "answer": "B", "explanation": "化归的核心原则是将未知的、复杂的、困难的问题转化为已知的、简单的、熟悉的问题。", "highYield": true}, {"id": "math_choice_007", "subjectId": "math", "chapter": "第六章 公理化方法", "type": "choice", "stem": "公理体系必须满足的三条基本要求中，最根本、最基本的要求是（ ）", "options": ["A. 完备性", "B. 独立性", "C. 相容性（无矛盾性）", "D. 形式化"], "answer": "C", "explanation": "相容性（无矛盾性）是公理系统的底线与首要要求，如果公理体系自相矛盾，整个理论体系就会瓦解崩溃。", "highYield": true}, {"id": "math_choice_008", "subjectId": "math", "chapter": "第八章 数学证明", "type": "choice", "stem": "从结论出发，倒推寻求充分条件，直到已知条件的证明方法是（ ）", "options": ["A. 综合法（由因导果）", "B. 分析法（执果索因）", "C. 反证法", "D. 数学归纳法"], "answer": "B", "explanation": "分析法是执果索因，从要证的结论出发，探求其成立的充分条件，直到已知条件；综合法是由因导果，从已知推向未知。", "highYield": true}, {"id": "math_choice_009", "subjectId": "math", "chapter": "第十章 算法", "type": "choice", "stem": "下列关于算法特征的说法中，错误的是（ ）", "options": ["A. 算法具有有限性，必须在有限步内结束", "B. 算法具有确定性，每一步操作必须明确无歧义", "C. 算法可以有0个或多个输入", "D. 算法可以没有输出"], "answer": "D", "explanation": "算法五大特征：有限性、确定性、有效性、输入（0个或多个）、输出（必须至少有1个或多个输出）。没有输出的算法是没有意义的。", "highYield": true}, {"id": "math_choice_010", "subjectId": "math", "chapter": "第四章 化归方法", "type": "choice", "stem": "欧拉解决哥尼斯堡七桥问题，将陆地抽象为点、桥梁抽象为线，所运用的核心思想方法是（ ）", "options": ["A. 穷举法与解析几何", "B. 数学模型方法与化归思想", "C. 极限思想与微积分", "D. 概率统计方法"], "answer": "B", "explanation": "欧拉将现实地理问题抽象为几何图形（图论模型），并化归为一笔画问题，体现了模型化与化归思想的完美结合。", "highYield": true}, {"id": "math_chap_card_001", "subjectId": "math", "chapter": "第一章 数学思想方法概述【高频填空、判断】", "type": "fill", "stem": "【第一章 数学思想方法概述【高频填空、判断】·考点速记全览】\n数学思想方法概述【高频填空、判断】\n1. 数学思想、数学方法定义\n数学思想：对数学知识本质的认识，是建立数学、解决问题的指导思想（高层次，偏观念）\n...（点击查看本章完整速记考点）", "options": null, "answer": "数学思想方法概述【高频填空、判断】\n1. 数学思想、数学方法定义\n数学思想：对数学知识本质的认识，是建立数学、解决问题的指导思想（高层次，偏观念）\n数学方法：数学研究中采用的手段、途径、步骤（低层次，偏操作）\n两者经常合称数学思想方法\n2. 数学教学两条主线\n数学基础知识（明线）+数学思想方法（暗线），真题反复判断题：两条不都是明线。\n3. 推动数学发展的两大动力\n① 实践的需要；② 理论的需要\n4. 数学的特点（简答）\n抽象性、严谨性、应用广泛性\n抽象性：无物质性，舍弃事物物理属性，只保留数量与空间形式；多层次抽象。\n严谨性：逻辑严密，结论确定，依靠演绎证明。\n广泛应用性：几乎所有学科都可以使用数学模型。\n5. 学生掌握数学思想方法三阶段（简答必考）\n潜意识阶段：只做题，没有意识到思想方法；\n明朗化阶段：学习后，清晰意识到方法；\n深刻理解阶段：能主动运用、迁移到新问题。", "explanation": "【教材精讲重点】：对应《09097 数学思想与方法》第一章 数学思想方法概述【高频填空、判断】核心考点浓缩。", "highYield": true}, {"id": "math_chap_card_002", "subjectId": "math", "chapter": "第二章 数学思想方法的几次重大突破【填空、简答】", "type": "fill", "stem": "【第二章 数学思想方法的几次重大突破【填空、简答】·考点速记全览】\n数学思想方法的几次重大突破【填空、简答】\n第一次：从算术到代数 标志：引入字母符号；核心：符号化思想。\n第二次：常量数学→变量数学 基础：解析几何；标志：微积分诞生；研究运动、变化。\n...（点击查看本章完整速记考点）", "options": null, "answer": "数学思想方法的几次重大突破【填空、简答】\n第一次：从算术到代数 标志：引入字母符号；核心：符号化思想。\n第二次：常量数学→变量数学 基础：解析几何；标志：微积分诞生；研究运动、变化。\n第三次：确定性数学→随机数学 研究随机现象；随机现象：一定条件下，结果不确定，但大量重复有统计规律。\n第四次：公理化；非欧几何诞生 打破欧氏几何唯一真理；推动数学公理化思想。\n古代数学两大体系： ①古希腊：《几何原本》，重逻辑演绎、公理化； ②中国古代：《九章算术》，重算法、实际应用。【填空高频】", "explanation": "【教材精讲重点】：对应《09097 数学思想与方法》第二章 数学思想方法的几次重大突破【填空、简答】核心考点浓缩。", "highYield": true}, {"id": "math_chap_card_003", "subjectId": "math", "chapter": "第三章 抽象方法【简答、判断】", "type": "fill", "stem": "【第三章 抽象方法【简答、判断】·考点速记全览】\n抽象方法【简答、判断】\n1. 数学抽象特点\n无物质性、层次性、以概括为基础\n...（点击查看本章完整速记考点）", "options": null, "answer": "抽象方法【简答、判断】\n1. 数学抽象特点\n无物质性、层次性、以概括为基础\n无物质性：剥离物体材质，只保留数量、形状。\n2. 抽象类型（名词解释）\n弱抽象：从原型中选取某一特征，减弱条件得到新概念；由特殊→一般（如：正方形→矩形→平行四边形）\n强抽象：在原有概念中增加新特征；一般→特殊（三角形→等腰三角形）\n广义抽象：两个概念定义有逻辑先后，但不是强弱抽象。\n判断考点：弱抽象：特殊到一般；强抽象：一般到特殊。", "explanation": "【教材精讲重点】：对应《09097 数学思想与方法》第三章 抽象方法【简答、判断】核心考点浓缩。", "highYield": true}, {"id": "math_chap_card_004", "subjectId": "math", "chapter": "第四章 化归方法【重中之重！简答+论述】", "type": "fill", "stem": "【第四章 化归方法【重中之重！简答+论述】·考点速记全览】\n化归方法【重中之重！简答+论述】\n1. 化归定义\n化归：转化与归结。把待解决的未知、复杂问题，转化为已经解决/容易解决的问题。 核心原则：未知→已知，复杂→简单，困难→容易\n...（点击查看本章完整速记考点）", "options": null, "answer": "化归方法【重中之重！简答+论述】\n1. 化归定义\n化归：转化与归结。把待解决的未知、复杂问题，转化为已经解决/容易解决的问题。 核心原则：未知→已知，复杂→简单，困难→容易\n2. 化归三要素（简答必背）\n化归对象、化归目标、化归途径\n对象：需要转化的问题；\n目标：转化后要得到的熟悉问题；\n途径：实现转化的手段（换元、数形结合、分割等）\n3. 化归基本原则（论述高频）\n熟悉化原则：转化为熟悉题型；\n简单化原则：简化问题形式；\n和谐化原则：问题形式符合数学体系统一；\n直观化原则：抽象转直观；\n标准化原则：化为标准模型。\n4. 化归的形式\n多维→一维；高次→低次；空间→平面；无理式→有理式；分式→整式。\n真题例子：哥尼斯堡七桥问题，欧拉把陆地抽象为点、桥抽象为线，转化一笔画问题，是模型化+化归。", "explanation": "【教材精讲重点】：对应《09097 数学思想与方法》第四章 化归方法【重中之重！简答+论述】核心考点浓缩。", "highYield": true}, {"id": "math_chap_card_005", "subjectId": "math", "chapter": "第五章 数学模型方法【简答、论述】", "type": "fill", "stem": "【第五章 数学模型方法【简答、论述】·考点速记全览】\n数学模型方法【简答、论述】\n1. 数学模型定义\n用数学符号、公式、图形刻画原型，反映原型本质关系。 数学模型特点：抽象性、准确性、演绎性、预测性。\n...（点击查看本章完整速记考点）", "options": null, "answer": "数学模型方法【简答、论述】\n1. 数学模型定义\n用数学符号、公式、图形刻画原型，反映原型本质关系。 数学模型特点：抽象性、准确性、演绎性、预测性。\n2. 数学建模步骤（简答）\n分析原型：了解现实问题；\n简化假设：舍弃次要因素；\n构造模型：建立方程/图形/关系式；\n求解模型：数学演算；\n检验模型：对比现实，验证；\n解释应用：把数学结果翻译回现实问题。\n3. 模型分类\n确定性模型、随机性模型；静态模型、动态模型。\n判断考点：数学模型不只是数学应用题；经济、军事、生物都可用数学模型。", "explanation": "【教材精讲重点】：对应《09097 数学思想与方法》第五章 数学模型方法【简答、论述】核心考点浓缩。", "highYield": true}, {"id": "math_chap_card_006", "subjectId": "math", "chapter": "第六章 公理化方法【名词解释、简答】", "type": "fill", "stem": "【第六章 公理化方法【名词解释、简答】·考点速记全览】\n公理化方法【名词解释、简答】\n1. 公理化方法\n从少数不加定义的原始概念、不加证明的公理出发，用演绎推理，推出一系列定理，构建完整理论体系。《几何原本》是最早公理化典范。\n...（点击查看本章完整速记考点）", "options": null, "answer": "公理化方法【名词解释、简答】\n1. 公理化方法\n从少数不加定义的原始概念、不加证明的公理出发，用演绎推理，推出一系列定理，构建完整理论体系。《几何原本》是最早公理化典范。\n2. 公理化三阶段\n实质公理化（《几何原本》）：公理对应直观空间；\n形式公理化（希尔伯特《几何基础》）：对象可以不直观，只满足公理关系；\n纯形式公理化：符号系统。\n3. 公理三条基本要求（简答）\n相容性（无矛盾）：公理之间不能互相推出矛盾；最重要；\n独立性：任何公理不能由其他公理推导出来；\n完备性：体系内所有真命题都能由公理推出。\n判断：公理化方法不能说是万能的。", "explanation": "【教材精讲重点】：对应《09097 数学思想与方法》第六章 公理化方法【名词解释、简答】核心考点浓缩。", "highYield": true}, {"id": "math_chap_card_007", "subjectId": "math", "chapter": "第七章 归纳、类比与猜想【高频选择判断】", "type": "fill", "stem": "【第七章 归纳、类比与猜想【高频选择判断】·考点速记全览】\n归纳、类比与猜想【高频选择判断】\n1. 归纳法\n不完全归纳法：考察部分对象，得出一般结论；结论不一定可靠，用于猜想发现。\n...（点击查看本章完整速记考点）", "options": null, "answer": "归纳、类比与猜想【高频选择判断】\n1. 归纳法\n不完全归纳法：考察部分对象，得出一般结论；结论不一定可靠，用于猜想发现。\n完全归纳法：考察全部对象；结论可靠，属于严格证明。\n2. 类比法\n根据两个对象部分属性相同，推断其余属性也相同。 特点：结论具有或然性（不一定正确），属于合情推理，用来提出猜想。\n表层类比：形式表面相似；\n深层类比：本质结构相似。\n3. 猜想\n猜想两大特点：一定科学性、一定推测性。猜想需要后续演绎证明，猜想不等于证明。\n区分：归纳、类比属于合情推理（发现猜想）；演绎推理用来证明结论。", "explanation": "【教材精讲重点】：对应《09097 数学思想与方法》第七章 归纳、类比与猜想【高频选择判断】核心考点浓缩。", "highYield": true}, {"id": "math_chap_card_008", "subjectId": "math", "chapter": "第八章 数学证明【名词解释、简答】", "type": "fill", "stem": "【第八章 数学证明【名词解释、简答】·考点速记全览】\n数学证明【名词解释、简答】\n1. 演绎推理\n从一般原理推出个别结论；前提真，推理形式正确，则结论必然真；数学证明主要依靠演绎推理。\n...（点击查看本章完整速记考点）", "options": null, "answer": "数学证明【名词解释、简答】\n1. 演绎推理\n从一般原理推出个别结论；前提真，推理形式正确，则结论必然真；数学证明主要依靠演绎推理。\n2. 证明方法\n分析法：执果索因。从结论出发，倒推需要的条件，直到已知。\n综合法：由因导果。从已知条件出发，逐步推出结论。\n反证法：否定结论，推出矛盾，从而证明原命题成立。", "explanation": "【教材精讲重点】：对应《09097 数学思想与方法》第八章 数学证明【名词解释、简答】核心考点浓缩。", "highYield": true}, {"id": "math_chap_card_009", "subjectId": "math", "chapter": "第九章 分类方法【填空、简答】", "type": "fill", "stem": "【第九章 分类方法【填空、简答】·考点速记全览】\n分类方法【填空、简答】\n分类定义：按统一标准，把对象划分若干子项。\n分类两大要素：母项、子项。\n...（点击查看本章完整速记考点）", "options": null, "answer": "分类方法【填空、简答】\n分类定义：按统一标准，把对象划分若干子项。\n分类两大要素：母项、子项。\n分类三条原则（简答） ① 同一标准：全程只能用一个分类标准； ② 完备性：所有对象都分到子项，无遗漏； ③ 互斥性：子项之间互相不重叠。\n真题判断：同一对象，选取不同标准，可以得到不同分类。", "explanation": "【教材精讲重点】：对应《09097 数学思想与方法》第九章 分类方法【填空、简答】核心考点浓缩。", "highYield": true}, {"id": "math_chap_card_010", "subjectId": "math", "chapter": "第十章 算法【填空判断】", "type": "fill", "stem": "【第十章 算法【填空判断】·考点速记全览】\n算法【填空判断】\n算法定义\n算法是一组有限规则，解决一类问题。 算法五大特征：有限性、确定性、有效性、输入、输出。\n...（点击查看本章完整速记考点）", "options": null, "answer": "算法【填空判断】\n算法定义\n算法是一组有限规则，解决一类问题。 算法五大特征：有限性、确定性、有效性、输入、输出。\n判断高频坑：算法具有有限性，不是无限；算法每一步确定，不是不确定。", "explanation": "【教材精讲重点】：对应《09097 数学思想与方法》第十章 算法【填空判断】核心考点浓缩。", "highYield": true}, {"id": "math_chap_card_011", "subjectId": "math", "chapter": "第十一章 数形结合思想", "type": "fill", "stem": "【第十一章 数形结合思想·考点速记全览】\n数形结合思想\n核心：数与形相互转化，代数问题几何直观，几何问题代数量化。本质属于化归思想。\n...（点击查看本章完整速记考点）", "options": null, "answer": "数形结合思想\n核心：数与形相互转化，代数问题几何直观，几何问题代数量化。本质属于化归思想。", "explanation": "【教材精讲重点】：对应《09097 数学思想与方法》第十一章 数形结合思想核心考点浓缩。", "highYield": true}, {"id": "math_chap_card_012", "subjectId": "math", "chapter": "第十二章 数学思想方法教学【论述大题重点！】", "type": "fill", "stem": "【第十二章 数学思想方法教学【论述大题重点！】·考点速记全览】\n数学思想方法教学【论述大题重点！】\n1. 数学思想方法教学原则（论述背诵）\n渗透性原则：在知识教学中渗透，不单独生硬讲授；\n...（点击查看本章完整速记考点）", "options": null, "answer": "数学思想方法教学【论述大题重点！】\n1. 数学思想方法教学原则（论述背诵）\n渗透性原则：在知识教学中渗透，不单独生硬讲授；\n循序渐进原则：由浅入深，反复渗透；\n反复性原则：思想方法要多次在不同知识场景重现；\n系统性原则：整体规划，形成体系。\n2. 数学思想方法教学途径（简答）\n在概念形成过程渗透；\n在定理公式推导过程渗透；\n在问题解决过程渗透；\n在复习小结中提炼、总结思想方法。\n3. 论述常考：数学思想方法教学价值\n帮助学生深刻理解数学知识；\n提升思维能力；\n培养创新意识；\n提升学生数学核心素养。\n数学基础知识是明线，数学思想方法是暗线。（√）\n数学抽象具有无物质性。（√）\n公理化方法不是万能的。（√）\n猜想具有科学性和推测性。（√）\n哥尼斯堡七桥问题欧拉用一笔画解决。（√）\n分类两大要素：母项、子项。（√）\n算法具有有限性、确定性、有效性。（√）\n不完全归纳推理得到的结论不一定正确。（√）\n类比推理结论具有或然性。（√）\n分析法是执果索因；综合法由因导果。（√）\n《九章算术》侧重算法应用；《几何原本》侧重逻辑演绎。（√）\n弱抽象：特殊到一般；强抽象：一般到特殊。（√）\n随机现象：一定条件下结果不确定，大量重复有统计规律。（√）\n学生掌握数学思想方法三阶段：潜意识、明朗化、深刻理解。（√）\n简述数学的三个基本特点。\n简述学生理解数学思想方法的三个阶段。\n简述化归方法的含义、三要素、基本原则。\n简述数学模型方法的建模步骤。\n简述公理化方法中公理体系的三个基本要求。\n简述分类方法的基本原则。\n简述数学思想方法教学的基本原则。\n论述：在数学教学中如何渗透数学思想方法。", "explanation": "【教材精讲重点】：对应《09097 数学思想与方法》第十二章 数学思想方法教学【论述大题重点！】核心考点浓缩。", "highYield": true}]}, {"id": "innov", "name": "创新思维理论与方法", "code": "03298 / 09468", "badge": "TRIZ理论 + 技法大全 + 创业实践", "icon": "💡", "color": "#f59e0b", "description": "涵盖创新本质与创业要素、突破思维定势、发散与收敛思维、六顶思考帽、和田十二法、TRIZ矛盾矩阵与40发明原理全解。", "questions": [{"id": "innov_judge_001", "subjectId": "innov", "chapter": "第一章 创新的本质与类型", "type": "judge", "stem": "熊彼特指出，创新的本质是建立一种新的生产函数，实现生产要素的新组合。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "美籍奥地利经济学家熊彼特在《经济发展理论》中首次提出：创新就是建立一种新的生产函数，把生产要素和生产条件的新组合引入生产体系。", "highYield": true}, {"id": "innov_judge_002", "subjectId": "innov", "chapter": "第一章 创新的本质与类型", "type": "judge", "stem": "狭义的创新仅聚焦于技术与产品层面，而广义创新涵盖了管理、商业模式甚至“零科技”创新。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "狭义创新指科技发明与技术改进；广义创新包括思维、组织、商业模式、文化等各维度的突破，“零科技”也能通过模式重构产生巨大创新价值。", "highYield": true}, {"id": "innov_judge_003", "subjectId": "innov", "chapter": "第二章 创新思维基础", "type": "judge", "stem": "怀炳和尚利用大船装沙、减重上浮的浮力原理打捞铁牛，体现了对传统思维定势的突破。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "怀炳和尚没有采用传统人力硬拉的常规方法，而是巧借自然浮力和水的浮力平衡，是教材中突破习惯思维定势的经典案例。", "highYield": true}, {"id": "innov_judge_004", "subjectId": "innov", "chapter": "第三章 发散与收敛思维", "type": "judge", "stem": "发散思维的三大核心评价指标是流畅性、变通性和独特性。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "美国心理学家吉尔福特提出发散思维三维度：流畅性（单位时间内产生观念数量）、变通性（思维灵活性与跨类别能力）、独特性（新奇独到罕见见解）。", "highYield": true}, {"id": "innov_judge_005", "subjectId": "innov", "chapter": "第六章 创新技法", "type": "judge", "stem": "头脑风暴法（BS法）在讨论过程中应当鼓励与会者对他人提出的不成熟方案进行即时批评纠正。", "options": ["错误 (×)", "正确 (√)"], "answer": "错误", "explanation": "绝对错误！头脑风暴法的首要原则是【延迟评判 / 禁止批评】，过早批判会扼杀新奇构想与创造性灵感。", "highYield": true}, {"id": "innov_judge_006", "subjectId": "innov", "chapter": "第三章 思维导图与六顶思考帽", "type": "judge", "stem": "在六顶思考帽方法中，黑帽代表的是乐观、寻找价值与优势。", "options": ["错误 (×)", "正确 (√)"], "answer": "错误", "explanation": "错误！【黄帽】代表乐观与价值探索；【黑帽】代表谨慎、批判、寻找漏洞与风险评估；【白帽】代表客观事实数据；【红帽】代表直觉情感；【绿帽】代表创造力新想法；【蓝帽】代表统筹控制。", "highYield": true}, {"id": "innov_judge_007", "subjectId": "innov", "chapter": "第五章 TRIZ 创新方法概论", "type": "judge", "stem": "TRIZ理论创始人阿奇舒勒认为，世界上绝大多数技术矛盾可以通过40个发明原理进行解决。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "苏联发明家阿奇舒勒通过分析全球250万件高水平专利，总结出解决技术矛盾的39个通用工程参数与40个发明原理。", "highYield": true}, {"id": "innov_judge_008", "subjectId": "innov", "chapter": "第七章 技术矛盾与物理矛盾", "type": "judge", "stem": "物理矛盾是指系统同一个参数既要求满足A，又要求满足非A（矛盾要求指向同一参数）。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "技术矛盾是两个不同参数之间的相互制约；物理矛盾是同一个参数同时具有互相对立的要求（如既要大又要小，既要热又要冷）。", "highYield": true}, {"id": "innov_judge_009", "subjectId": "innov", "chapter": "第七章 技术矛盾与物理矛盾", "type": "judge", "stem": "解决物理矛盾的核心方法是四大分离原理：空间分离、时间分离、条件分离、整体与部分分离。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "物理矛盾的经典解决途径就是将互相对立的属性进行分离：在不同空间、不同时间、不同条件或系统宏观与微观层面上分别实现。", "highYield": true}, {"id": "innov_judge_010", "subjectId": "innov", "chapter": "第八章 TRIZ 创新思维方法", "type": "judge", "stem": "TRIZ中的最终理想解（IFR）是指系统在不增加任何额外成本或资源的前提下，自身实现全部有用功能并消除所有有害作用。", "options": ["正确 (√)", "错误 (×)"], "answer": "正确", "explanation": "理想度 = 有用功能总和 / (有害功能总和 + 成本总和)。理想解的极限是物质实体不存在，但功能完全得到实现。", "highYield": true}, {"id": "innov_choice_011", "subjectId": "innov", "chapter": "第一章 创新的本质与类型", "type": "choice", "stem": "小米通过“质高价优、接近成本定价”打开市场，后以“互联网+新零售”开设小米之家，体现的创新类型属于（ ）", "options": ["A. 商业模式创新与组织管理创新", "B. 单纯的材料科学创新", "C. 基础物理理论突破", "D. 实验室技术转移"], "answer": "A", "explanation": "小米重构了供应链与销售渠道，融合线上电商与线下坪效极致的新零售，属于典型的商业模式与生态创新。", "highYield": true}, {"id": "innov_choice_012", "subjectId": "innov", "chapter": "第四章 联想与想象思维", "type": "choice", "stem": "上海世博会中国馆“东方之冠”层层出挑的斗拱造型，运用的联想方法主要是（ ）", "options": ["A. 对比联想", "B. 相似联想", "C. 因果联想", "D. 接近联想"], "answer": "B", "explanation": "相似联想是由于事物在形态、性质或功能上的相似性而引发的联想，如中国馆与中国古代传统斗拱、冠帽的形态神似。", "highYield": true}, {"id": "innov_choice_013", "subjectId": "innov", "chapter": "第六章 创新技法", "type": "choice", "stem": "我国著名教育家陶行知先生创立的和田十二法（加一加、减一减、扩一扩、缩一缩、变一变、改一改等）属于（ ）", "options": ["A. 检核表法与设问列举类技法", "B. 纯数学公理推演法", "C. 物-场分析法", "D. 计算机仿真模拟法"], "answer": "A", "explanation": "和田十二法是检核表法在中国本土化创造性应用的典范，通过12个通俗动词引导大众开展多维度创新联想。", "highYield": true}, {"id": "innov_choice_014", "subjectId": "innov", "chapter": "第六章 创新技法", "type": "choice", "stem": "头脑风暴法的提出者是美国BBDO广告公司创始人（ ）", "options": ["A. 阿奇舒勒", "B. 奥斯本（Alex F. Osborn）", "C. 爱德华·德·博诺", "D. 熊彼特"], "answer": "B", "explanation": "亚历克斯·奥斯本于1938年提出头脑风暴法（Brainstorming），被誉为“创造工程之父”。", "highYield": true}, {"id": "innov_choice_015", "subjectId": "innov", "chapter": "第三章 思维导图与六顶思考帽", "type": "choice", "stem": "在六顶思考帽中，代表“直觉、预感、情绪与非理性感受”，无需寻找合理依据即可表达的是（ ）", "options": ["A. 白色思考帽", "B. 红色思考帽", "C. 黑色思考帽", "D. 蓝色思考帽"], "answer": "B", "explanation": "红色思考帽专用于表达直觉、预感和情绪感受，无需证明或给出合理解释。", "highYield": true}, {"id": "innov_choice_016", "subjectId": "innov", "chapter": "第三章 思维导图与六顶思考帽", "type": "choice", "stem": "在六顶思考帽中，主持会议、控制讨论进程、进行总结提炼的“指挥官”角色是（ ）", "options": ["A. 蓝帽", "B. 绿帽", "C. 黄帽", "D. 黑帽"], "answer": "A", "explanation": "蓝色思考帽负责思考过程的控制与组织，像乐队指挥一样决定何时戴何种帽子，控制节奏与做出结论。", "highYield": true}, {"id": "innov_choice_017", "subjectId": "innov", "chapter": "第六章 40 个发明原理", "type": "choice", "stem": "将折叠伞做成多节伸缩结构、保温杯设计为内外多层嵌套，运用的TRIZ发明原理是（ ）", "options": ["A. 原理1：分割原理", "B. 原理7：嵌套原理（套叠原理）", "C. 原理13：反向作用原理", "D. 原理10：预先作用原理"], "answer": "B", "explanation": "发明原理第7号——嵌套原理（Nested Doll）：将一个物体置于另一个物体内部，或使一个物体穿过另一个物体的空腔。", "highYield": true}, {"id": "innov_choice_018", "subjectId": "innov", "chapter": "第六章 40 个发明原理", "type": "choice", "stem": "潜水艇通过注水下沉、排水上浮，利用的是TRIZ发明原理中的（ ）", "options": ["A. 原理15：动态特性原理", "B. 原理35：物理或化学状态变化原理", "C. 原理1：分割原理", "D. 原理2：抽取原理"], "answer": "A", "explanation": "动态特性原理（Dynamicity）：改变物体或环境对象，使其在工作过程的各阶段达到最佳状态，使不动的物体动起来，增加可变性。", "highYield": true}, {"id": "innov_choice_019", "subjectId": "innov", "chapter": "第六章 40 个发明原理", "type": "choice", "stem": "双金属片温度计利用两种膨胀系数不同的金属结合，受热时产生弯曲，运用的TRIZ发明原理是（ ）", "options": ["A. 原理3：局部质量原理", "B. 原理4：增加不对称性原理", "C. 原理40：复合材料原理", "D. 原理36：相变原理"], "answer": "C", "explanation": "原理40——复合材料原理：从同一材质转变为复合材质，组合各自优点以获得单一材料所不具备的特异物理性能。", "highYield": true}, {"id": "innov_choice_020", "subjectId": "innov", "chapter": "第五章 创新与创业的关系", "type": "choice", "stem": "下列关于创业三大核心要素及其关系的表述中，正确的是（ ）", "options": ["A. 机会、创业团队、资源；三者相互依存并处于动态平衡中", "B. 资金、专利、厂房；资金是唯一决定性要素", "C. 政策、市场、劳动力；市场完全决定创业成败", "D. 创始人、投资人、消费者；创始人拥有全部收益"], "answer": "A", "explanation": "蒂蒙斯（Timmons）创业模型指出，创业由创业机会、创业团队和创业资源三大核心要素组成，创业过程是三者动态匹配与平衡的过程。", "highYield": true}, {"id": "innov_essay_021", "subjectId": "innov", "chapter": "第一章 创新的本质与类型", "type": "essay", "stem": "简述创新的七大基本特征。", "options": null, "answer": "① 目的性：创新是人类为解决生存发展问题、创造更美好生活而开展的有意识实践；\n② 突破性：突破传统认知框架与思维定势，跨界整合知识产出新成果；\n③ 新颖性：引入前所未有的新观念、新方法、新技术或新产品；\n④ 普遍性：创新存在于社会各领域、各行业和不同岗位；\n⑤ 艰巨性：创新充满不确定性，需要克服技术、资金、认知与制度上的多重阻力；\n⑥ 发展性：创新成果会激发后续创新，形成知识迭代与持续演进；\n⑦ 价值性：创新必须能产生可衡量的社会价值、经济价值或学术价值。", "explanation": "【核心得分点】：分项作答，答出加粗关键词即可得满分。", "highYield": true}, {"id": "innov_essay_022", "subjectId": "innov", "chapter": "第六章 创新技法", "type": "essay", "stem": "简述头脑风暴法（Brainstorming）的四项基本原则。", "options": null, "answer": "① 延迟评判（禁止批评）：在构想激发阶段，严禁对任何人的想法进行反驳、批评或讥讽，保持畅所欲言的心理安全感；\n② 自由畅想（欢迎奇思异想）：鼓励异想天开，思维跨度越大、设想越新奇越好；\n③ 追求数量（以量求质）：在规定时间内尽量提出尽可能多的构想，数量往往是高质量创意的基石；\n④ 组合与改善（搭便车原则）：鼓励倾听他人构想，在他人构想的基础上进行嫁接、改进、延伸或组合，产生更优方案。", "explanation": "【核心得分点】：分项作答，答出加粗关键词即可得满分。", "highYield": true}, {"id": "innov_essay_023", "subjectId": "innov", "chapter": "第三章 思维导图与六顶思考帽", "type": "essay", "stem": "简述爱德华·德·博诺“六顶思考帽”中各色思考帽代表的思维模式。", "options": null, "answer": "① 白色思考帽（事实与数据）：代表客观中立，聚焦已知信息、事实数据及需要搜集的情报；\n② 红色思考帽（直觉与情感）：代表直觉、预感、喜好与情绪表达，不需要合理解释；\n③ 黑色思考帽（谨慎与批判）：代表逻辑否定，评估风险、寻找潜在缺陷、质疑可行性；\n④ 黄色思考帽（乐观与价值）：代表正面价值探索，寻找方案的优势、利益与积极面；\n⑤ 绿色思考帽（创造与构想）：代表创造力与新思路，提出新设想、突破常规的备选方案；\n⑥ 蓝色思考帽（统筹与控制）：代表元思维，控制整个思考进程，组织规则并做出总结。", "explanation": "【核心得分点】：分项作答，答出加粗关键词即可得满分。", "highYield": true}, {"id": "innov_essay_024", "subjectId": "innov", "chapter": "第七章 技术矛盾与物理矛盾", "type": "essay", "stem": "简述TRIZ理论中解决物理矛盾的四种分离原理，并各举一例说明。", "options": null, "answer": "【物理矛盾】：当一个系统中的某个参数既要求具有某种特性，又要求具有相反特性时形成的矛盾。\n【四大分离原理及实例】：\n① 空间分离：将互相对立的属性分配在不同空间位置。例如：双焦点老花镜（上半部分看远，下半部分看近）；\n② 时间分离：将互相对立的属性分配在不同时间段。例如：飞机起落架（起飞降落时放下支撑，巡航飞行时收起减阻）；\n③ 条件分离（基于条件的状态分离）：在满足特定环境/物理条件时展现一种特性，不满足时展现相反特性。例如：变色太阳镜（强紫外线下变深色阻光，室内光线下变无色透明）；\n④ 整体与部分分离（系统级别分离）：微观个体呈现一种特性，宏观整体呈现另一种特性。例如：自行车的链条（每个链节是坚硬不可弯曲的刚体，但整个链条却具有高度的柔软可弯曲性）。", "explanation": "【核心得分点】：分项作答，答出加粗关键词即可得满分。", "highYield": true}, {"id": "innov_essay_025", "subjectId": "innov", "chapter": "第三章 创新思维", "type": "essay", "stem": "论述：新时代青年大学生如何克服思维定势，培养和提升自身创新思维能力？", "options": null, "answer": "【理论联系实际论述要点】：\n1. 深刻认识并突破五大常见思维定势：\n   - 克服习惯定势：避免凭老规矩办事，善于换角度思考；\n   - 克服权威定势：不唯上、不唯师、不迷信学术权威，保持批判性怀疑；\n   - 克服从众定势：敢为人先，不随波逐流；\n   - 克服书本经验定势：理论联系实际，避免教条化生搬硬套。\n2. 刻意训练发散思维与收敛思维的交替运用：\n   - 运用材料发散、功能发散、因果发散拓展思维广度与变通性；\n   - 结合收敛思维对创意进行可行性筛选与逻辑验证。\n3. 掌握并熟练运用科学创新技法：\n   - 熟练运用和田十二法（加一加、缩一缩、反一反）、奥斯本检核表法激发灵感；\n   - 学习TRIZ理论的40个发明原理与矛盾矩阵，运用工程系统化方法解决实际难题。\n4. 投身跨学科实践与双创活动：\n   - 走出单一专业舒适圈，积极参与创客马拉松、挑战杯大赛、产学研协同创新，在真实复杂的工程与商业情境中磨砺创新韧性与实战能力。", "explanation": "【核心得分点】：分项作答，答出加粗关键词即可得满分。", "highYield": true}, {"id": "innov_cram_001", "subjectId": "innov", "chapter": "考前1天速记口诀卡", "type": "fill", "stem": "【速记卡】40个发明原理精选速背：请快速回忆其核心关键词与内涵。", "options": null, "answer": "【核心词】： 分割、抽取、局部质量、嵌套、反向作用、曲面化、动态特性、预先作用、复合材料\n【释义】： 阿奇舒勒总结的40个经典发明原理，针对矛盾矩阵提供工程解题方向。", "explanation": "考前1天强行记忆卡片，必背必得分。", "highYield": true}, {"id": "innov_cram_002", "subjectId": "innov", "chapter": "考前1天速记口诀卡", "type": "fill", "stem": "【速记卡】和田十二法口诀：请快速回忆其核心关键词与内涵。", "options": null, "answer": "【核心词】： 加一加、减一减、扩一扩、缩一缩、变一变、改一改、提一提、反一反、搬一搬、联一联、代一代、定一定\n【释义】： 陶行知提出，通俗易懂的12字创新技法口诀。", "explanation": "考前1天强行记忆卡片，必背必得分。", "highYield": true}, {"id": "innov_cram_003", "subjectId": "innov", "chapter": "考前1天速记口诀卡", "type": "fill", "stem": "【速记卡】物理矛盾四大分离原理：请快速回忆其核心关键词与内涵。", "options": null, "answer": "【核心词】： 空间分离、时间分离、条件分离、整体与部分分离\n【释义】： 将对立的属性在不同空间、时间、条件或系统层次上分别满足。", "explanation": "考前1天强行记忆卡片，必背必得分。", "highYield": true}, {"id": "innov_cram_004", "subjectId": "innov", "chapter": "考前1天速记口诀卡", "type": "fill", "stem": "【速记卡】六顶思考帽颜色对应：请快速回忆其核心关键词与内涵。", "options": null, "answer": "【核心词】： 白-客观事实、红-直觉情感、黑-风险批判、黄-正面价值、绿-创新构想、蓝-流程统筹\n【释义】： 德·博诺提出的平行思维工具，大幅提高团队研讨决策效率。", "explanation": "考前1天强行记忆卡片，必背必得分。", "highYield": true}, {"id": "innov_triz_001", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理1：分割 的核心内涵及典型应用是什么？", "options": null, "answer": "将物体分成独立部分；使物体成为可拆卸的；增加物体的分割程度。（例：组合家具、分段火箭）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理1：分割。", "highYield": true}, {"id": "innov_triz_002", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理2：抽取（分离） 的核心内涵及典型应用是什么？", "options": null, "answer": "从物体中抽出产生负面影响的部分，或仅抽出必要的部分。（例：压缩机外置的分体空调）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理2：抽取（分离）。", "highYield": true}, {"id": "innov_triz_003", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理3：局部质量 的核心内涵及典型应用是什么？", "options": null, "answer": "将同质结构变为异质结构；使不同部分具有不同功能。（例：橡皮擦铅笔、不同功能分区的瑞士军刀）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理3：局部质量。", "highYield": true}, {"id": "innov_triz_004", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理4：增加不对称性 的核心内涵及典型应用是什么？", "options": null, "answer": "将对称形态改为不对称形态；增加现有不对称程度。（例：非对称花纹轮胎、人体工学鼠标）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理4：增加不对称性。", "highYield": true}, {"id": "innov_triz_005", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理5：组合（合并） 的核心内涵及典型应用是什么？", "options": null, "answer": "在空间上将同类或相邻操作的物体合并；在时间上合并相同或连续的操作。（例：多联装打印机、风光互补发电）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理5：组合（合并）。", "highYield": true}, {"id": "innov_triz_006", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理6：多功能性 的核心内涵及典型应用是什么？", "options": null, "answer": "使一个物体具备多种功能，从而消除其他物体。（例：智能手机集成相机/导航/钱包、沙发床）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理6：多功能性。", "highYield": true}, {"id": "innov_triz_007", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理7：嵌套（套叠） 的核心内涵及典型应用是什么？", "options": null, "answer": "将一个物体放入另一个物体内部；使一个物体穿过另一个物体的空腔。（例：俄罗斯套娃、折叠伸缩天线）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理7：嵌套（套叠）。", "highYield": true}, {"id": "innov_triz_008", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理8：反重力（重量补偿） 的核心内涵及典型应用是什么？", "options": null, "answer": "将物体与产生浮力的其他物体结合；通过与介质的气动或流体动力相互作用补偿重量。（例：气垫船、水翼船）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理8：反重力（重量补偿）。", "highYield": true}, {"id": "innov_triz_009", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理9：预先反作用 的核心内涵及典型应用是什么？", "options": null, "answer": "预先施加反向应力，以抵消工作时可能出现的不利应力。（例：预应力钢筋混凝土、防爆玻璃）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理9：预先反作用。", "highYield": true}, {"id": "innov_triz_010", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理10：预先作用 的核心内涵及典型应用是什么？", "options": null, "answer": "在操作前预先对物体进行全部或部分改变；预先将物体放置在最方便操作的位置。（例：预先打孔的邮票撕裂线、手术前器械消毒摆放）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理10：预先作用。", "highYield": true}, {"id": "innov_triz_011", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理13：反向作用 的核心内涵及典型应用是什么？", "options": null, "answer": "不按常规要求进行，而是反其道而行之；使可动物体不动，不动或环境动。（例：跑步机、旋转餐厅）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理13：反向作用。", "highYield": true}, {"id": "innov_triz_012", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理15：动态特性 的核心内涵及典型应用是什么？", "options": null, "answer": "使物体或环境在操作的每个阶段自动调整到最佳状态；将物体分成相互移动的部分。（例：折叠自行车、潜艇注排水浮沉）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理15：动态特性。", "highYield": true}, {"id": "innov_triz_013", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理17：多维化（空间维数改变） 的核心内涵及典型应用是什么？", "options": null, "answer": "将一维移动转为二维，二维转为三维；利用多层结构代替单层结构；倾斜或倾翻物体。（例：立体车库、多层高架立交桥）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理17：多维化（空间维数改变）。", "highYield": true}, {"id": "innov_triz_014", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理19：周期性作用 的核心内涵及典型应用是什么？", "options": null, "answer": "将连续动作改为周期性动作（脉冲）；在脉冲之间改变脉冲频率。（例：脉冲除尘、ABS防抱死刹车系统）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理19：周期性作用。", "highYield": true}, {"id": "innov_triz_015", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理24：中介物 的核心内涵及典型应用是什么？", "options": null, "answer": "使用中介物体传递或实现所需动作；将容易去除的物体临时附加到原物体上。（例：隔热锅垫、烤箱手套、注射器针头保护套）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理24：中介物。", "highYield": true}, {"id": "innov_triz_016", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理35：物理或化学状态变化 的核心内涵及典型应用是什么？", "options": null, "answer": "改变物体的物理状态（固、液、气）；改变浓度、柔韧度或温度。（例：干冰清洗、低温冷冻麻醉）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理35：物理或化学状态变化。", "highYield": true}, {"id": "innov_triz_017", "subjectId": "innov", "chapter": "第六章 40个发明原理速记", "type": "fill", "stem": "【TRIZ 40个发明原理速刷】原理40：复合材料 的核心内涵及典型应用是什么？", "options": null, "answer": "将单一材质换为复合材料以结合各自特性。（例：碳纤维增强塑料、钢化夹胶玻璃）", "explanation": "阿奇舒勒总结的TRIZ高频发明原理：原理40：复合材料。", "highYield": true}]}];

    // App State
    let currentSubjectId = 'marx';
    let currentMode = 'drill'; // 'drill', 'memo', 'wrong', 'mock', 'cheatsheet', 'search'
    let currentQIndex = 0;
    let userAnswers = JSON.parse(localStorage.getItem('exam_user_answers') || '{}');
    let wrongBook = JSON.parse(localStorage.getItem('exam_wrong_book') || '{}');
    let autoAdvance = true;
    let allAnswersVisible = true;

    // Initialize App
    function init() {
      renderSubjectTabs();
      setupKeyboardListeners();
      document.getElementById('autoAdvanceToggle').addEventListener('change', (e) => {
        autoAdvance = e.target.checked;
      });
      loadSubject(currentSubjectId);
    }

    function getSubject() {
      return SUBJECTS.find(s => s.id === currentSubjectId) || SUBJECTS[0];
    }

    function renderSubjectTabs() {
      const container = document.getElementById('subjectBar');
      container.innerHTML = SUBJECTS.map(s => {
        const isActive = s.id === currentSubjectId;
        const total = s.questions.length;
        return `
          <div class="subject-pill ${isActive ? 'active' : ''}" style="${isActive ? `color: ${s.color}; border-color: ${s.color};` : ''}" onclick="switchSubject('${s.id}')">
            <span>${s.icon}</span>
            <span>${s.name}</span>
            <span class="badge" style="background: rgba(255,255,255,0.1);">${total}题</span>
          </div>
        `;
      }).join('');
    }

    function switchSubject(subId) {
      currentSubjectId = subId;
      currentQIndex = 0;
      renderSubjectTabs();
      loadSubject(subId);
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('#modeBar button').forEach((btn, idx) => {
        const modes = ['drill', 'memo', 'wrong', 'mock', 'cheatsheet', 'search'];
        btn.classList.toggle('active', modes[idx] === mode);
      });

      document.getElementById('drillView').style.display = (mode === 'drill' || mode === 'wrong') ? 'block' : 'none';
      document.getElementById('memoView').style.display = mode === 'memo' ? 'block' : 'none';
      document.getElementById('cheatSheetView').style.display = mode === 'cheatsheet' ? 'block' : 'none';
      document.getElementById('searchView').style.display = mode === 'search' ? 'block' : 'none';
      document.getElementById('mockView').style.display = mode === 'mock' ? 'block' : 'none';

      if (mode === 'drill' || mode === 'wrong') {
        currentQIndex = 0;
        renderDrillQuestion();
      } else if (mode === 'memo') {
        renderMemoList();
      } else if (mode === 'cheatsheet') {
        renderCheatSheet();
      } else if (mode === 'search') {
        doSearch();
      }
      updateStats();
    }

    function getActiveQuestions() {
      const sub = getSubject();
      if (currentMode === 'wrong') {
        const wrongIds = wrongBook[currentSubjectId] || [];
        return sub.questions.filter(q => wrongIds.includes(q.id));
      }
      return sub.questions;
    }

    function loadSubject(subId) {
      updateStats();
      if (currentMode === 'drill' || currentMode === 'wrong') {
        renderDrillQuestion();
      } else if (currentMode === 'memo') {
        renderMemoList();
      } else if (currentMode === 'cheatsheet') {
        renderCheatSheet();
      }
    }

    function updateStats() {
      const sub = getSubject();
      const allQ = sub.questions;
      const subAns = userAnswers[currentSubjectId] || {};
      const wrongList = wrongBook[currentSubjectId] || [];

      const total = allQ.length;
      const answeredKeys = Object.keys(subAns);
      const answeredCount = answeredKeys.length;
      let correctCount = 0;

      answeredKeys.forEach(k => {
        const q = allQ.find(item => item.id === k);
        if (q && subAns[k] === q.answer) correctCount++;
      });

      const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      const progressPercent = total > 0 ? Math.round((answeredCount / total) * 100) : 0;

      document.getElementById('statTotalQ').innerText = total;
      document.getElementById('statAnsweredQ').innerText = answeredCount;
      document.getElementById('statAccuracy').innerText = accuracy + '%';
      document.getElementById('statWrongQ').innerText = wrongList.length;
      document.getElementById('statPercent').innerText = progressPercent + '%';
      document.getElementById('statProgressFill').style.width = progressPercent + '%';
      document.getElementById('wrongCountBadge').innerText = wrongList.length;
    }

    // Render Speed Drill Question
    function renderDrillQuestion() {
      const list = getActiveQuestions();
      const panel = document.getElementById('questionBox');
      const jumpGrid = document.getElementById('jumpGrid');

      if (!list || list.length === 0) {
        if (currentMode === 'wrong') {
          panel.innerHTML = `
            <div style="text-align: center; padding: 60px 20px;">
              <h2 style="color: var(--success); margin-bottom: 12px;">🎉 太棒了！暂无错题</h2>
              <p style="color: var(--text-muted); margin-bottom: 20px;">你已将本科目的错题全部消灭清零，或者尚未开始做题。</p>
              <button class="btn btn-primary" onclick="setMode('drill')">返回极速刷题</button>
            </div>
          `;
          jumpGrid.innerHTML = '';
          return;
        }
      }

      if (currentQIndex >= list.length) currentQIndex = list.length - 1;
      if (currentQIndex < 0) currentQIndex = 0;

      const q = list[currentQIndex];
      const subAns = userAnswers[currentSubjectId] || {};
      const selected = subAns[q.id];
      const hasAnswered = selected !== undefined;
      const isCorrect = selected === q.answer;

      // Type Badge Name
      let typeLabel = "单选题";
      if (q.type === 'judge') typeLabel = "判断题";
      if (q.type === 'multiple') typeLabel = "多选题";
      if (q.type === 'fill') typeLabel = "速背填空";
      if (q.type === 'essay') typeLabel = "论述简答";

      // Build Options HTML
      let optionsHtml = '';
      if (q.options && q.options.length > 0) {
        optionsHtml = `
          <div class="options-grid">
            ${q.options.map((opt, idx) => {
              const letter = opt.substring(0, 1).toUpperCase();
              let btnClass = "";
              if (hasAnswered) {
                if (letter === q.answer || opt === q.answer) {
                  btnClass = "selected-correct";
                } else if (selected === letter || selected === opt) {
                  btnClass = "selected-wrong";
                }
              }
              const shortcutKey = idx < 4 ? ['A','B','C','D'][idx] : (idx+1);
              return `
                <button class="option-btn ${btnClass}" onclick="handleAnswer('${letter}')">
                  <span class="opt-key">${shortcutKey}</span>
                  <span>${opt}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      } else {
        // Fill or Essay Type Question
        optionsHtml = `
          <div style="margin: 20px 0;">
            <button class="btn ${hasAnswered ? 'btn-success' : 'btn-primary'}" onclick="handleAnswer('SHOW_ANSWER')">
              ${hasAnswered ? '👁️ 答案已揭晓' : '🔍 查看标准答案与评分采分点'}
            </button>
          </div>
        `;
      }

      // Analysis HTML
      let analysisHtml = '';
      if (hasAnswered) {
        analysisHtml = `
          <div class="analysis-box">
            <div class="ans-title" style="color: ${isCorrect ? 'var(--success)' : 'var(--danger)'};">
              ${isCorrect ? '✅ 回答正确！' : '❌ 正确答案：' + q.answer}
            </div>
            <div style="font-size: 0.95rem; line-height: 1.7; color: var(--text); white-space: pre-line;">
              ${q.explanation || ''}
            </div>
          </div>
        `;
      }

      panel.innerHTML = `
        <div class="question-meta">
          <div class="badges">
            <span class="badge badge-primary">${typeLabel}</span>
            <span class="badge">${q.chapter || '综合'}</span>
            ${q.highYield ? '<span class="badge badge-hot">🔥 考前密押</span>' : ''}
          </div>
          <div style="font-size: 0.9rem; font-weight: 700; color: var(--text-muted);">
            第 ${currentQIndex + 1} / ${list.length} 题
          </div>
        </div>

        <div class="q-stem">${q.stem}</div>

        ${optionsHtml}
        ${analysisHtml}

        <div class="action-bar">
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-sm" onclick="prevQuestion()" ${currentQIndex === 0 ? 'disabled' : ''}>⬅️ 上一题</button>
            <button class="btn btn-sm" onclick="nextQuestion()" ${currentQIndex === list.length - 1 ? 'disabled' : ''}>下一题 ➡️</button>
            <button class="btn btn-sm" onclick="randomQuestion()">🔀 随机抽题</button>
          </div>
          <div style="font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px;">
            <span>键盘极速操作:</span>
            <span class="kbd">1-4</span>
            <span class="kbd">A-D</span>
            <span class="kbd">Space/Enter</span>
          </div>
        </div>
      `;

      // Render Jump Grid
      document.getElementById('jumpStats').innerText = `${currentQIndex + 1} / ${list.length}`;
      jumpGrid.innerHTML = list.map((item, idx) => {
        const itemAns = subAns[item.id];
        let statusClass = "";
        if (idx === currentQIndex) statusClass += " current";
        if (itemAns !== undefined) {
          statusClass += (itemAns === item.answer || itemAns === 'SHOW_ANSWER') ? " done-correct" : " done-wrong";
        }
        return `
          <div class="jump-num ${statusClass}" onclick="jumpToQuestion(${idx})">
            ${idx + 1}
          </div>
        `;
      }).join('');
    }

    function handleAnswer(ansKey) {
      const list = getActiveQuestions();
      const q = list[currentQIndex];
      if (!userAnswers[currentSubjectId]) userAnswers[currentSubjectId] = {};
      if (!wrongBook[currentSubjectId]) wrongBook[currentSubjectId] = [];

      userAnswers[currentSubjectId][q.id] = ansKey;
      localStorage.setItem('exam_user_answers', JSON.stringify(userAnswers));

      const isCorrect = (ansKey === q.answer || ansKey === 'SHOW_ANSWER');
      if (!isCorrect) {
        if (!wrongBook[currentSubjectId].includes(q.id)) {
          wrongBook[currentSubjectId].push(q.id);
        }
      } else {
        // If answered correctly in wrong mode, remove it
        if (currentMode === 'wrong') {
          wrongBook[currentSubjectId] = wrongBook[currentSubjectId].filter(id => id !== q.id);
        }
      }
      localStorage.setItem('exam_wrong_book', JSON.stringify(wrongBook));

      updateStats();
      renderDrillQuestion();

      if (autoAdvance && isCorrect && currentQIndex < list.length - 1 && q.options) {
        setTimeout(() => {
          nextQuestion();
        }, 500);
      }
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        currentQIndex--;
        renderDrillQuestion();
      }
    }

    function nextQuestion() {
      const list = getActiveQuestions();
      if (currentQIndex < list.length - 1) {
        currentQIndex++;
        renderDrillQuestion();
      }
    }

    function randomQuestion() {
      const list = getActiveQuestions();
      if (list.length > 1) {
        currentQIndex = Math.floor(Math.random() * list.length);
        renderDrillQuestion();
      }
    }

    function jumpToQuestion(idx) {
      currentQIndex = idx;
      renderDrillQuestion();
    }

    // Keyboard Listener
    function setupKeyboardListeners() {
      window.addEventListener('keydown', (e) => {
        if (currentMode !== 'drill' && currentMode !== 'wrong') return;
        const key = e.key.toUpperCase();

        if (key === 'ARROWLEFT') {
          prevQuestion();
        } else if (key === 'ARROWRIGHT' || key === ' ' || key === 'ENTER') {
          const list = getActiveQuestions();
          const q = list[currentQIndex];
          const subAns = userAnswers[currentSubjectId] || {};
          if (subAns[q.id] === undefined && (!q.options || q.options.length === 0)) {
            handleAnswer('SHOW_ANSWER');
          } else {
            nextQuestion();
          }
        } else if (['A', 'B', 'C', 'D'].includes(key)) {
          handleAnswer(key);
        } else if (['1', '2', '3', '4'].includes(key)) {
          const mapping = {'1': 'A', '2': 'B', '3': 'C', '4': 'D'};
          handleAnswer(mapping[key]);
        }
      });
    }

        .replace(/“([^”]+)”/g, '<strong>“$1”</strong>');

    // Instant Search
    function doSearch() {
      const qText = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const resultsContainer = document.getElementById('searchResults');
      if (!qText) {
        resultsContainer.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 40px;">请输入关键词开始全库检索...</div>';
        return;
      }

      const matched = [];
      SUBJECTS.forEach(sub => {
        sub.questions.forEach(q => {
          if (
            q.stem.toLowerCase().includes(qText) ||
            (q.answer && q.answer.toLowerCase().includes(qText)) ||
            (q.explanation && q.explanation.toLowerCase().includes(qText))
          ) {
            matched.push({ subject: sub, question: q });
          }
        });
      });

      if (matched.length === 0) {
        resultsContainer.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 40px;">未找到匹配题目或考点，请尝试更换关键词。</div>';
        return;
      }

      resultsContainer.innerHTML = `
        <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px;">
          共检索到 <strong>${matched.length}</strong> 条相关考题与知识点：
        </div>
        ${matched.map((item, idx) => `
          <div class="memo-card">
            <div class="memo-header">
              <span class="memo-title">[${item.subject.name}] ${item.question.stem}</span>
              <span class="badge badge-primary">${item.question.chapter || ''}</span>
            </div>
            <div class="memo-content">
              <strong>参考答案</strong>：${item.question.answer}\n
              <span style="font-size: 0.85rem; color: var(--text-muted);">
                💡 解析：${item.question.explanation || '考前核心考点'}
              </span>
            </div>
          </div>
        `).join('')}
      `;
    }

    // Mock Exam
    let mockTimer = null;
    let mockSecondsLeft = 45 * 60;

    function startMockExam() {
      document.getElementById('mockIntroBox').style.display = 'none';
      const box = document.getElementById('mockContentBox');
      box.style.display = 'block';

      const sub = getSubject();
      // Sample 30 questions
      const sampled = [...sub.questions].sort(() => 0.5 - Math.random()).slice(0, 30);
      mockSecondsLeft = 45 * 60;

      box.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 16px 20px; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid var(--card-border);">
          <div>
            <h3 style="margin-bottom: 4px;">📝 ${sub.name} · 全真模拟测试</h3>
            <span style="font-size: 0.85rem; color: var(--text-muted);">共 30 题 · 满分 100 分 · 及格线 60 分</span>
          </div>
          <div style="font-size: 1.5rem; font-weight: 700; color: #f59e0b;" id="mockClock">45:00</div>
          <button class="btn btn-danger" onclick="submitMock()">交卷评分</button>
        </div>
        <div class="cards-list" id="mockQuestionsContainer">
          ${sampled.map((q, idx) => `
            <div class="memo-card" id="mock_q_box_${idx}">
              <div style="font-weight: 600; margin-bottom: 12px;">${idx + 1}. ${q.stem}</div>
              ${q.options ? `
                <div class="options-grid">
                  ${q.options.map(opt => {
                    const letter = opt.substring(0, 1);
                    return `
                      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 0;">
                        <input type="radio" name="mock_ans_${idx}" value="${letter}">
                        <span>${opt}</span>
                      </label>
                    `;
                  }).join('')}
                </div>
              ` : `
                <textarea class="search-input-box" rows="3" placeholder="请输入简答核心要点..." name="mock_ans_${idx}"></textarea>
              `}
              <div id="mock_eval_${idx}" style="display: none; margin-top: 10px; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.2);"></div>
            </div>
          `).join('')}
        </div>
        <div style="text-align: center; margin-top: 30px;">
          <button class="btn btn-success" style="padding: 12px 40px; font-size: 1.1rem;" onclick="submitMock()">完成作答，立即交卷</button>
        </div>
      `;

      if (mockTimer) clearInterval(mockTimer);
      mockTimer = setInterval(() => {
        mockSecondsLeft--;
        const mins = Math.floor(mockSecondsLeft / 60);
        const secs = mockSecondsLeft % 60;
        const clockEl = document.getElementById('mockClock');
        if (clockEl) {
          clockEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        if (mockSecondsLeft <= 0) {
          clearInterval(mockTimer);
          alert('考试时间已到，自动交卷！');
          submitMock();
        }
      }, 1000);

      window.currentMockQuestions = sampled;
    }

    function submitMock() {
      if (mockTimer) clearInterval(mockTimer);
      const sampled = window.currentMockQuestions || [];
      let score = 0;
      const pointPerQ = Math.round(100 / sampled.length);

      sampled.forEach((q, idx) => {
        let userVal = "";
        if (q.options) {
          const radio = document.querySelector(`input[name="mock_ans_${idx}"]:checked`);
          if (radio) userVal = radio.value;
        } else {
          const area = document.querySelector(`textarea[name="mock_ans_${idx}"]`);
          if (area) userVal = area.value.trim();
        }

        const isOk = (q.options ? userVal === q.answer : userVal.length > 5);
        if (isOk) score += pointPerQ;

        const evalBox = document.getElementById(`mock_eval_${idx}`);
        if (evalBox) {
          evalBox.style.display = 'block';
          evalBox.innerHTML = `
            <div style="font-weight: 700; color: ${isOk ? 'var(--success)' : 'var(--danger)'};">
              ${isOk ? '✅ 正确 (+ ' + pointPerQ + '分)' : '❌ 标准答案：' + q.answer}
            </div>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
              解析：${q.explanation || '核心考点'}
            </div>
          `;
        }
      });

      if (score > 100) score = 100;
      const isPass = score >= 60;
      alert(`🎉 模考交卷完成！\n最终成绩：${score} 分 (${isPass ? '合格通过！恭喜！' : '未及格，考前继续抓紧速刷薄弱题！'})`);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
    }

    function clearProgress() {
      if (confirm('确定要清空本地所有刷题记录与错题本吗？')) {
        localStorage.removeItem('exam_user_answers');
        localStorage.removeItem('exam_wrong_book');
        userAnswers = {};
        wrongBook = {};
        updateStats();
        renderDrillQuestion();
      }
    }

    // Run on Load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
